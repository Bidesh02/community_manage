{% extends 'base.html' %}

{% block title %}Sign In | AegisGate Society Manager{% endblock %}

{% block content %}
<div style="min-height: 80vh; display: flex; align-items: center; justify-content: center; padding: 20px;">
  <div class="glass-panel" style="max-width: 460px; width: 100%; padding: 40px; position: relative; overflow: hidden;">
    <div style="text-align: center; margin-bottom: 30px;">
      <div style="width: 58px; height: 58px; margin: 0 auto 16px; background: linear-gradient(135deg, var(--primary), var(--accent-cyan)); border-radius: 16px; display: flex; align-items: center; justify-content: center; box-shadow: var(--shadow-glow); font-size: 26px;">
        <i class="fa-solid fa-shield-halved" style="color: white;"></i>
      </div>
      <h2 style="font-size: 1.6rem; font-weight: 800; letter-spacing: -0.02em;">AegisGate Portal</h2>
      <p style="color: var(--text-muted); font-size: 0.88rem; margin-top: 4px;">Smart Residential Society & Biometric Operations</p>
    </div>

    <form method="POST" action="{% url 'login' %}">
      {% csrf_token %}
      <div class="form-group">
        <label class="form-label" for="id_username">Username</label>
        <div style="position: relative;">
          <input type="text" name="username" id="id_username" class="form-input" placeholder="e.g. admin or resident_john" required autofocus style="padding-left: 42px;">
          <i class="fa-solid fa-user" style="position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--text-dim);"></i>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="id_password">Password</label>
        <div style="position: relative;">
          <input type="password" name="password" id="id_password" class="form-input" placeholder="••••••••" required style="padding-left: 42px;">
          <i class="fa-solid fa-lock" style="position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--text-dim);"></i>
        </div>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; padding: 13px; font-size: 1rem; margin-top: 10px;">
        <span>Sign In to Society Hub</span>
        <i class="fa-solid fa-arrow-right"></i>
      </button>
    </form>

    <!-- Quick Demo Logins for Pair Programming / Evaluation -->
    <div style="margin-top: 28px; padding-top: 20px; border-top: 1px solid var(--border-glass);">
      <div style="font-size: 0.76rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-dim); margin-bottom: 12px; text-align: center;">
        Quick Test Accounts (Click to Fill)
      </div>
      <div style="display: flex; flex-direction: column; gap: 8px;">
        <button type="button" class="btn btn-secondary btn-sm" onclick="fillCreds('admin', 'admin123')" style="justify-content: space-between;">
          <span><i class="fa-solid fa-user-shield" style="color: var(--primary);"></i> Super Admin (Manager)</span>
          <span class="badge-code">admin / admin123</span>
        </button>
        <button type="button" class="btn btn-secondary btn-sm" onclick="fillCreds('guard_vikram', 'guard123')" style="justify-content: space-between;">
          <span><i class="fa-solid fa-shield" style="color: var(--accent-cyan);"></i> Security Gate Guard</span>
          <span class="badge-code">guard_vikram / guard123</span>
        </button>
        <button type="button" class="btn btn-secondary btn-sm" onclick="fillCreds('john_doe', 'resident123')" style="justify-content: space-between;">
          <span><i class="fa-solid fa-house-user" style="color: var(--accent-emerald);"></i> Resident (Flat A-402)</span>
          <span class="badge-code">john_doe / resident123</span>
        </button>
      </div>
    </div>

    <div style="text-align: center; margin-top: 24px; font-size: 0.88rem; color: var(--text-muted);">
      New resident moving in? <a href="{% url 'register' %}" style="color: var(--accent-cyan); font-weight: 600; text-decoration: none;">Register Flat</a>
    </div>
  </div>
</div>

<script>
  function fillCreds(u, p) {
    document.getElementById('id_username').value = u;
    document.getElementById('id_password').value = p;
  }
</script>
{% endblock %}
